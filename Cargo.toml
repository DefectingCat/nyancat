[package]
name = "nyancat"
version = "0.1.3"
edition = "2024"

[features]
default = []
http = [
    "axum",
    "axum-extra",
    "tower-http",
    "serde_json",
    "serde",
    "serde_repr",
    "tower-serve-static",
    "include_dir",
]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"

tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# http
axum = { version = "0.8.9", features = ["ws"], optional = true }
axum-extra = { version = "0.12.6", features = [
    "typed-header",
], optional = true }
futures = "0.3.32"
futures-util = { version = "0.3.32", default-features = false, features = [
    "sink",
    "std",
] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
tower-http = { version = "0.6.11", features = ["full"], optional = true }
serde_repr = { version = "0.1.20", optional = true }
tower-serve-static = { version = "0.1.2", optional = true }
include_dir = { version = "0.7.4", optional = true }
